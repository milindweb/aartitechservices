<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password - Aarti Tech Services</title>
  <script src="/shared/js/config.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css" />
  <link rel="stylesheet" href="/shared/css/headerfooter.css" />
  <link rel="stylesheet" href="/shared/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/headerfooter.js" defer></script>
  <script src="/shared/js/auth.js"></script>
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card" id="requestCard">
      <div class="auth-logo">
        <a href="/">AartiTech<span>Services</span></a>
      </div>
      <h1>Reset Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link</p>

      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>

      <form class="auth-form" id="requestForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="auth-btn" id="requestBtn">
          <span class="spinner"></span>
          <span class="btn-text">Send Reset Link</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="/login">Back to sign in</a>
      </div>
    </div>

    <div class="auth-card" id="updateCard" style="display:none;">
      <div class="auth-logo">
        <a href="/">AartiTech<span>Services</span></a>
      </div>
      <h1>Set New Password</h1>
      <p class="auth-subtitle">Enter your new password</p>

      <div id="updateError" class="auth-error"></div>
      <div id="updateSuccess" class="auth-success"></div>

      <form class="auth-form" id="updateForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)" tabindex="-1">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmNewPassword" placeholder="Repeat password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" onclick="togglePassword('confirmNewPassword', this)" tabindex="-1">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="updateBtn">
          <span class="spinner"></span>
          <span class="btn-text">Update Password</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="/login">Back to sign in</a>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('type') === 'recovery') {
      document.getElementById('requestCard').style.display = 'none';
      document.getElementById('updateCard').style.display = 'block';
    }

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('requestBtn');
      const email = document.getElementById('email').value;

      clearMessages('auth');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        await AUTH.resetPassword(email);
        showSuccess('Check your email for a password reset link.', 'auth');
        document.getElementById('email').value = '';
        btn.classList.remove('loading');
        btn.disabled = false;
      } catch (err) {
        showError(err.message || 'Failed to send reset link', 'auth');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('updateBtn');
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;

      clearMessages('update');

      if (password !== confirm) {
        showError('Passwords do not match', 'update');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters', 'update');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        await AUTH.updatePassword(password);
        showSuccess('Password updated! Redirecting to login...', 'update');
        setTimeout(() => { window.location.href = '/login'; }, 2000);
      } catch (err) {
        showError(err.message || 'Failed to update password', 'update');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    }

    function showError(msg, prefix) {
      const el = document.getElementById(prefix + 'Error');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function showSuccess(msg, prefix) {
      const el = document.getElementById(prefix + 'Success');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function clearMessages(prefix) {
      document.getElementById(prefix + 'Error').classList.remove('visible');
      document.getElementById(prefix + 'Success').classList.remove('visible');
    }
  </script>
</body>
</html>
