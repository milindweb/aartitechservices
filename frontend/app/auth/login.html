<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign In - Aarti Tech Services</title>
  <script src="/shared/js/config.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css" />
  <link rel="stylesheet" href="/shared/css/headerfooter.css" />
  <link rel="stylesheet" href="/shared/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/headerfooter.js" defer></script>
  <script src="/shared/js/auth.js"></script>
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">AartiTech<span>Services</span></a>
      </div>
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" tabindex="-1">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="auth-checkbox">
            <input type="checkbox" id="remember" checked />
            <span>Remember me</span>
          </label>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="/register">Create an account</a> &middot;
        <a href="/reset-password">Forgot password?</a>
      </div>

      <div class="auth-divider">OR</div>

      <button class="auth-btn auth-btn-google" id="googleLoginBtn" onclick="handleGoogleSignIn()">
        <i class="fab fa-google"></i>
        <span class="btn-text">Sign in with Google</span>
      </button>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTo = urlParams.get('redirect') || '/dashboard';

    if (urlParams.get('confirmed')) {
      showSuccess('Email confirmed! You can now sign in.');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      clearMessages();
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        await AUTH.signIn(email, password);
        window.location.href = redirectTo;
      } catch (err) {
        showError(err.message || 'Invalid email or password');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    async function handleGoogleSignIn() {
      try {
        await AUTH.signInWithGoogle();
      } catch (err) {
        showError(err.message || 'Google sign-in failed');
      }
    }

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function showSuccess(msg) {
      const el = document.getElementById('authSuccess');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function clearMessages() {
      document.getElementById('authError').classList.remove('visible');
      document.getElementById('authSuccess').classList.remove('visible');
    }
  </script>
</body>
</html>
