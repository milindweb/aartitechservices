<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Create Account - Aarti Tech Services</title>
  <script src="/shared/js/config.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css" />
  <link rel="stylesheet" href="/shared/css/headerfooter.css" />
  <link rel="stylesheet" href="/shared/css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/headerfooter.js" defer></script>
  <script src="/shared/js/auth.js"></script>
</head>
<body>
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/">AartiTech<span>Services</span></a>
      </div>
      <h1>Create Account</h1>
      <p class="auth-subtitle">Join Aarti Tech Services</p>

      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Your full name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" placeholder="+91 98765 43210" autocomplete="tel" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)" tabindex="-1">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Repeat password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" tabindex="-1">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="auth-checkbox">
            <input type="checkbox" id="terms" required />
            <span>I agree to the <a href="/terms" target="_blank">Terms of Service</a></span>
          </label>
        </div>
        <button type="submit" class="auth-btn" id="registerBtn">
          <span class="spinner"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <div class="auth-links">
        Already have an account? <a href="/login">Sign in</a>
      </div>

      <div class="auth-divider">OR</div>

      <button class="auth-btn auth-btn-google" id="googleRegisterBtn" onclick="handleGoogleSignIn()">
        <i class="fab fa-google"></i>
        <span class="btn-text">Sign up with Google</span>
      </button>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    async function handleGoogleSignIn() {
      try {
        await AUTH.signInWithGoogle();
      } catch (err) {
        showError(err.message || 'Google sign-in failed');
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      clearMessages();

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const { data } = await AUTH.signUp(email, password, { full_name: fullName, phone });

        if (data?.user?.identities?.length === 0) {
          showError('This email is already registered. Please sign in.');
          btn.classList.remove('loading');
          btn.disabled = false;
          return;
        }

        if (data?.session) {
          window.location.href = '/dashboard';
          return;
        }

        showSuccess('Account created! Check your email for a confirmation link.');
        document.getElementById('registerForm').reset();
        btn.classList.remove('loading');
        btn.disabled = false;
      } catch (err) {
        showError(err.message || 'Registration failed');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function showSuccess(msg) {
      const el = document.getElementById('authSuccess');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function clearMessages() {
      document.getElementById('authError').classList.remove('visible');
      document.getElementById('authSuccess').classList.remove('visible');
    }
  </script>
</body>
</html>
