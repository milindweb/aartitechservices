<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Audit Logs - Admin - Aarti Tech Services</title>
  <script src="/shared/js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Audit Logs', description: 'View system audit logs', canonical: '/app/admin/audit', brandTitle: false };</script>
  <script src="/shared/js/seo-injector.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css" />
  <link rel="stylesheet" href="/shared/css/headerfooter.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/headerfooter.js" defer></script>
  <style>
    .admin-page { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .admin-page h1 { font-size: 1.6rem; color: var(--text-primary); margin-bottom: 8px; }
    .admin-page .subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 24px; }
    .admin-nav { display:flex; gap:16px; margin-bottom:16px; }
    .admin-nav a { text-decoration:none; padding-bottom:4px; }
    .admin-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; box-shadow: var(--shadow);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-weight: 600; color: var(--text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
    td { color: var(--text-primary); }
    tr:last-child td { border-bottom: none; }
    .action-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
    }
    .action-profile_update { background: #3498db; color: #fff; }
    .action-email_change { background: #f39c12; color: #fff; }
    .action-role_change { background: #e74c3c; color: #fff; }
    .log-time { font-size: 0.75rem; color: var(--text-secondary); }
    .log-user { font-weight: 500; }
    .details-toggle {
      color: var(--accent); cursor: pointer; font-size: 0.78rem;
      background:none; border:none; text-decoration:underline;
    }
    .details-json {
      display: none; font-size: 0.75rem; color: var(--text-secondary);
      background: var(--secondary-bg); padding: 8px; border-radius: 6px;
      margin-top: 4px; max-width: 300px; overflow-x: auto; white-space: pre-wrap;
      word-break: break-all;
    }
    .msg {
      padding: 12px 16px; border-radius: 8px; font-size: 0.85rem;
      margin-bottom: 16px; display: none;
    }
    .msg.visible { display: block; }
    .msg-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .loading-row td { text-align: center; padding: 40px; color: var(--text-secondary); }
    .back-link { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="admin-page">
    <a href="/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    <div class="admin-nav">
      <a href="/app/admin" style="color:var(--text-secondary);">Users</a>
      <a href="/app/admin/audit" style="font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);">Audit Logs</a>
    </div>
    <h1>Audit Logs</h1>
    <p class="subtitle">System activity log — visible to admins only</p>
    <div id="msg" class="msg"></div>
    <div class="admin-card">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>User</th>
            <th>Module</th>
            <th>Action</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="logsBody">
          <tr class="loading-row"><td colspan="5">Loading audit logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    var currentUserId = null;

    (async function() {
      try {
        if (typeof AUTH !== 'undefined' && AUTH.requireAuth) {
          var session = await AUTH.requireAuth();
          if (!session) return;
          var user = await AUTH.getUser();
          if (!user || user.profile?.role !== 'admin') {
            window.location.href = '/dashboard';
            return;
          }
          currentUserId = user.id;
          await loadLogs();
        } else {
          window.location.href = '/login';
        }
      } catch (e) {
        window.location.href = '/login';
      }
    })();

    async function loadLogs() {
      var tbody = document.getElementById('logsBody');

      try {
        var { data, error } = await SUPABASE
          .from('audit_logs')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(200);

        if (error) throw error;

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr class="loading-row"><td colspan="5">No audit logs found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(function(log) {
          var time = log.created_at ? new Date(log.created_at).toLocaleString() : '-';
          var actionClass = 'action-' + (log.action || 'unknown');
          var userLabel = log.user_id ? log.user_id.substring(0, 8) + '...' : 'system';
          var hasDetails = log.old_values || log.new_values;
          var detailsId = 'details-' + (log.id || Math.random().toString(36).substr(2, 9));

          return '<tr>' +
            '<td><span class="log-time">' + escapeHtml(time) + '</span></td>' +
            '<td><span class="log-user">' + escapeHtml(userLabel) + '</span></td>' +
            '<td>' + escapeHtml(log.module || '-') + '</td>' +
            '<td><span class="action-badge ' + actionClass + '">' + escapeHtml((log.action || '').replace(/_/g, ' ')) + '</span></td>' +
            '<td>' +
            (hasDetails
              ? '<button class="details-toggle" onclick="toggleDetails(\'' + detailsId + '\')">View</button>' +
                '<div id="' + detailsId + '" class="details-json">' +
                (log.old_values ? 'Old: ' + escapeHtml(JSON.stringify(log.old_values, null, 2)) + '\n' : '') +
                (log.new_values ? 'New: ' + escapeHtml(JSON.stringify(log.new_values, null, 2)) : '') +
                '</div>'
              : '-'
            ) +
            '</td>' +
            '</tr>';
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr class="loading-row"><td colspan="5">Error loading logs: ' + escapeHtml(err.message) + '</td></tr>';
      }
    }

    function toggleDetails(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
