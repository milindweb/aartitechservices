<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Profile Settings - Aarti Tech Services</title>
  <script src="/shared/js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Profile Settings', description: 'Update your profile information', canonical: '/app/profile', brandTitle: false };</script>
  <script src="/shared/js/seo-injector.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css" />
  <link rel="stylesheet" href="/shared/css/headerfooter.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script src="/shared/js/headerfooter.js" defer></script>
  <style>
    .profile-page {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .profile-page h1 {
      font-size: 1.6rem;
      color: var(--text-primary);
      margin-bottom: 24px;
    }
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .profile-avatar-lg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .profile-meta h2 {
      font-size: 1.2rem;
      margin: 0 0 4px;
    }
    .profile-meta .email {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .profile-meta .role-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--accent);
      color: #fff;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--secondary-bg);
      color: var(--text-primary);
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group input[readonly] {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--secondary-bg); }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }
    .btn-danger:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
    .msg.visible { display: block; }
    .msg-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .msg-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .spinner-sm {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.5s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .links-section {
      margin-top: 16px;
    }
    .links-section a {
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .links-section a:hover { text-decoration: underline; }
    @media (max-width: 600px) {
      .profile-card { padding: 20px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <div class="profile-page">
    <h1>Profile Settings</h1>
    <div id="msg" class="msg"></div>
    <div class="profile-card" id="profileCard">
      <div class="profile-header" id="profileHeader">
        <div class="profile-avatar-lg" id="avatarLg">U</div>
        <div class="profile-meta">
          <h2 id="displayName">Loading...</h2>
          <div class="email" id="displayEmail">Loading...</div>
          <span class="role-badge" id="displayRole">Loading...</span>
        </div>
      </div>

      <form id="profileForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
          <span style="font-size:0.75rem;color:var(--text-secondary);margin-top:4px;display:block;">Changing email will send confirmation links to both addresses.</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210" />
          </div>
        </div>
        <div class="form-group">
          <label for="bio">Bio</label>
          <textarea id="bio" placeholder="Tell us a little about yourself..."></textarea>
        </div>
      </form>

      <div class="profile-actions">
        <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">Save Changes</button>
        <a href="/dashboard" class="btn btn-secondary">Cancel</a>
      </div>

      <div class="links-section">
        <a href="/reset-password"><i class="fas fa-key"></i> Change Password</a>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>
    var currentUser = null;

    (async function() {
      try {
        if (typeof AUTH !== 'undefined' && AUTH.requireAuth) {
          var session = await AUTH.requireAuth();
          if (!session) return;
          currentUser = await AUTH.getUser();
          if (!currentUser) {
            window.location.href = '/login';
            return;
          }
          renderProfile(currentUser);
        } else {
          window.location.href = '/login';
        }
      } catch (e) {
        window.location.href = '/login';
      }
    })();

    var originalEmail = '';

    async function logAudit(module, action, tableName, recordId, oldValues, newValues) {
      try {
        await SUPABASE.from('audit_logs').insert({
          user_id: currentUser.id,
          module: module,
          action: action,
          table_name: tableName,
          record_id: recordId,
          old_values: oldValues,
          new_values: newValues,
        });
      } catch (e) {
        console.error('Audit log error:', e);
      }
    }

    function renderProfile(user) {
      var profile = user.profile || {};
      var name = profile.full_name || user.email?.split('@')[0] || 'User';
      var initial = name.charAt(0).toUpperCase();

      document.getElementById('avatarLg').textContent = initial;
      document.getElementById('displayName').textContent = name;
      document.getElementById('displayEmail').textContent = user.email || '';
      document.getElementById('displayRole').textContent = profile.role || 'user';
      document.getElementById('email').value = user.email || '';
      originalEmail = user.email || '';
      document.getElementById('fullName').value = profile.full_name || '';
      document.getElementById('phone').value = profile.phone || '';
      document.getElementById('bio').value = profile.bio || '';
    }

    async function saveProfile() {
      var btn = document.getElementById('saveBtn');
      var email = document.getElementById('email').value.trim().toLowerCase();
      var fullName = document.getElementById('fullName').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var bio = document.getElementById('bio').value.trim();
      var emailChanged = email && email !== originalEmail;

      if (!fullName) {
        showMsg('Please enter your name.', 'error');
        return;
      }

      if (emailChanged && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMsg('Please enter a valid email address.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span>Saving...';

      try {
        var { error: profileError } = await SUPABASE
          .from('users_profile')
          .update({ full_name: fullName, phone: phone, bio: bio, updated_at: new Date().toISOString() })
          .eq('id', currentUser.id);

        if (profileError) throw profileError;

        if (emailChanged) {
          var { error: authError } = await SUPABASE.auth.updateUser({ email: email });
          if (authError) throw authError;
          showMsg('Profile saved! Check your new email for a confirmation link to complete the email change.', 'success');
          await logAudit('profile', 'email_change', 'users_profile', currentUser.id, { email: originalEmail }, { email: email });
        } else {
          showMsg('Profile updated successfully!', 'success');
          await logAudit('profile', 'profile_update', 'users_profile', currentUser.id, null, { full_name: fullName, phone: phone });
        }

        currentUser = await AUTH.getUser();
        renderProfile(currentUser);
      } catch (err) {
        showMsg(err.message || 'Failed to update profile.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    }

    function showMsg(text, type) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg visible msg-' + type;
      if (type === 'success') {
        setTimeout(function() { el.classList.remove('visible'); }, 3000);
      }
    }
  </script>
</body>
</html>
