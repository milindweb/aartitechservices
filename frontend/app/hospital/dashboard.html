<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/shared/js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Hospital Dashboard', description: 'Hospital management dashboard' };</script>
  <script src="/shared/js/seo-injector.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/auth.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/shared/css/headerfooter.css">
  <script src="/shared/js/headerfooter.js" defer></script>
  <script src="/app/hospital/js/hospital-nav.js" defer></script>
  <link rel="stylesheet" href="/app/hospital/css/hospital.css">
</head>
<body>
  <div id="header"></div>
  <div id="hospitalNav"></div>
  <div class="hosp-dashboard" id="app">
    <h1><i class="fas fa-hospital"></i> Hospital Dashboard</h1>

    <div class="hosp-stat-grid">
      <div class="hosp-card hosp-stat-card"><div class="hosp-stat-icon"><i class="fas fa-users"></i></div><div class="hosp-stat-value" id="totalPatients">—</div><div class="hosp-stat-label">Total Patients</div></div>
      <div class="hosp-card hosp-stat-card"><div class="hosp-stat-icon"><i class="fas fa-calendar-check"></i></div><div class="hosp-stat-value" id="todayVisits">—</div><div class="hosp-stat-label">Today's Visits</div></div>
      <div class="hosp-card hosp-stat-card"><div class="hosp-stat-icon"><i class="fas fa-clock"></i></div><div class="hosp-stat-value" id="pendingVisits">—</div><div class="hosp-stat-label">Pending</div></div>
      <div class="hosp-card hosp-stat-card"><div class="hosp-stat-icon"><i class="fas fa-calendar-alt"></i></div><div class="hosp-stat-value" id="todayAppointments">—</div><div class="hosp-stat-label">Appointments</div></div>
    </div>

    <div class="hosp-quick-actions">
      <a href="/app/hospital/new-visit" class="hosp-quick-action"><i class="fas fa-plus-circle"></i> New Visit</a>
      <a href="/app/hospital/patient-list" class="hosp-quick-action"><i class="fas fa-search"></i> Search Patients</a>
      <a href="/app/hospital/appointments" class="hosp-quick-action"><i class="fas fa-calendar-plus"></i> Appointments</a>
    </div>

    <div class="hosp-recent-section">
      <h3><i class="fas fa-history"></i> Recent Visits</h3>
      <div id="recentVisits"><p style="color:var(--hosp-text-secondary);">Loading...</p></div>
    </div>
  </div>
  <div id="footer"></div>
  <script>
    AUTH.requireAuth();

    async function loadDashboard() {
      const today = new Date().toISOString().split('T')[0];

      const [{ count: totalPatients }, { count: todayVisits }, { count: pendingVisits }, { count: todayAppts }, { data: recent }] = await Promise.all([
        SUPABASE.from('hospital_patients').select('*', { count: 'exact', head: true }),
        SUPABASE.from('hospital_visits').select('*', { count: 'exact', head: true }).gte('visit_date', today).lt('visit_date', today + 'T23:59:59'),
        SUPABASE.from('hospital_visits').select('*', { count: 'exact', head: true }).eq('visit_status', 'active'),
        SUPABASE.from('hospital_appointments').select('*', { count: 'exact', head: true }).eq('appointment_date', today),
        SUPABASE.from('hospital_visits').select('*, hospital_patients(*)').order('created_at', { ascending: false }).limit(10),
      ]);

      document.getElementById('totalPatients').textContent = totalPatients || 0;
      document.getElementById('todayVisits').textContent = todayVisits || 0;
      document.getElementById('pendingVisits').textContent = pendingVisits || 0;
      document.getElementById('todayAppointments').textContent = todayAppts || 0;

      const container = document.getElementById('recentVisits');
      if (!recent || recent.length === 0) {
        container.innerHTML = '<p style="color:var(--gray);">No recent visits.</p>';
      } else {
        container.innerHTML = recent.map(v => `
          <div class="hosp-visit-row">
            <div>
              <div class="hosp-patient-name">${v.hospital_patients?.full_name || 'Unknown'} <span class="hosp-visit-meta">#${v.opd_number}</span></div>
              <div class="hosp-visit-meta">${new Date(v.visit_date).toLocaleString()} · ${v.visit_type}</div>
            </div>
            <span class="hosp-badge hosp-badge-${v.visit_status === 'active' ? 'active' : 'completed'}">${v.visit_status}</span>
          </div>
        `).join('');
      }
    }
    loadDashboard();
  </script>
</body>
</html>
