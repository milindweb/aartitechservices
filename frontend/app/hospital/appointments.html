<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/shared/js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Appointments', description: 'Manage hospital appointments' };</script>
  <script src="/shared/js/seo-injector.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config/supabase.js"></script>
  <script src="/shared/js/auth.js"></script>
  <link rel="stylesheet" href="/shared/css/style.css">
  <link rel="stylesheet" href="/shared/css/headerfooter.css">
  <script src="/shared/js/headerfooter.js" defer></script>
  <link rel="stylesheet" href="/app/hospital/css/hospital.css">
  <style>
    .appt-page { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .appt-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    .date-nav { display: flex; align-items: center; gap: 12px; }
    .date-nav input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
    .appt-card { background: var(--hosp-card); border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .appt-card .patient-info { flex: 1; }
    .appt-card .patient-info h4 { margin-bottom: 2px; }
    .appt-card .patient-info .meta { font-size: 0.85rem; color: var(--gray); }
    .appt-status { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-scheduled { background: #e3f2fd; color: #1565c0; }
    .status-confirmed { background: #e8f5e9; color: #2e7d32; }
    .status-cancelled { background: #fce4ec; color: #c62828; }
    .status-completed { background: #f3e5f5; color: #6a1b9a; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--hosp-card); border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; }
    .modal .form-row { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="header"></div>
  <div class="appt-page" id="app">
    <div class="appt-header">
      <h1><i class="fas fa-calendar-alt"></i> Appointments</h1>
      <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> New Appointment</button>
    </div>
    <div class="date-nav">
      <button class="btn" onclick="changeDate(-1)"><i class="fas fa-chevron-left"></i></button>
      <input type="date" id="apptDate" onchange="loadAppointments()">
      <button class="btn" onclick="changeDate(1)"><i class="fas fa-chevron-right"></i></button>
      <button class="btn btn-sm" onclick="setToday()">Today</button>
    </div>
    <div style="margin-top:24px;" id="appointmentsList">
      <p style="color:var(--gray);">Loading...</p>
    </div>
  </div>

  <!-- New Appointment Modal -->
  <div class="modal-overlay" id="apptModal">
    <div class="modal">
      <h3><i class="fas fa-calendar-plus"></i> New Appointment</h3>
      <div class="form-row">
        <div class="form-group"><label>Patient Name *</label><input type="text" id="newApptName" placeholder="Search or type name"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Mobile</label><input type="tel" id="newApptMobile"></div>
        <div class="form-group"><label>Department</label><select id="newApptDept" onchange="loadModalDoctors()"><option value="">Select</option></select></div>
        <div class="form-group"><label>Doctor</label><select id="newApptDoctor"><option value="">Select</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Date *</label><input type="date" id="newApptDate"></div>
        <div class="form-group"><label>Time</label><input type="time" id="newApptTime"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea id="newApptNotes" rows="2"></textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:16px;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAppointment()">Save</button>
      </div>
    </div>
  </div>

  <div id="footer"></div>
  <script>
    AUTH.requireAuth();

    // Initialize date
    document.getElementById('apptDate').value = new Date().toISOString().split('T')[0];

    // Load departments for modal
    (async () => {
      const { data: depts } = await SUPABASE.from('hospital_departments').select('id,name').order('name');
      const sel = document.getElementById('newApptDept');
      if (depts) depts.forEach(d => { sel.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
    })();

    async function loadModalDoctors() {
      const deptId = document.getElementById('newApptDept').value;
      const sel = document.getElementById('newApptDoctor');
      sel.innerHTML = '<option value="">Select</option>';
      if (!deptId) return;
      const { data } = await SUPABASE.from('hospital_doctor_master').select('id,name').eq('department_id', deptId).eq('is_hospital', false);
      if (data) data.forEach(d => { sel.innerHTML += `<option value="${d.id}">${d.name}</option>`; });
    }

    function changeDate(delta) {
      const d = new Date(document.getElementById('apptDate').value);
      d.setDate(d.getDate() + delta);
      document.getElementById('apptDate').value = d.toISOString().split('T')[0];
      loadAppointments();
    }
    function setToday() {
      document.getElementById('apptDate').value = new Date().toISOString().split('T')[0];
      loadAppointments();
    }

    async function loadAppointments() {
      const date = document.getElementById('apptDate').value;
      const container = document.getElementById('appointmentsList');
      container.innerHTML = '<p style="color:var(--gray);">Loading...</p>';

      const { data, error } = await SUPABASE.from('hospital_opd_appointments')
        .select('*, hospital_patients(full_name,mobile,uhid), hospital_doctor_master(name), hospital_departments(name)')
        .gte('appointment_date', date + 'T00:00:00')
        .lt('appointment_date', date + 'T23:59:59')
        .order('appointment_date', { ascending: true });

      if (error) { container.innerHTML = `<p style="color:var(--danger);">${error.message}</p>`; return; }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:var(--gray);text-align:center;padding:40px;">No appointments for this date.</p>';
      } else {
        container.innerHTML = data.map(a => `
          <div class="appt-card">
            <div class="patient-info">
              <h4>${a.hospital_patients?.full_name || a.doctor_name || 'Unknown'}</h4>
              <div class="meta">${a.hospital_patients?.mobile || '—'} · #${a.hospital_patients?.uhid || '—'}</div>
              <div class="meta">${a.hospital_departments?.name || '—'} · ${new Date(a.appointment_date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${a.duration_minutes}min</div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <span class="appt-status status-${a.status}">${a.status}</span>
              ${a.status === 'scheduled' ? `<button class="btn btn-sm btn-primary" onclick="updateStatus('${a.id}','completed')"><i class="fas fa-check"></i></button> <button class="btn btn-sm btn-danger" onclick="updateStatus('${a.id}','cancelled')"><i class="fas fa-times"></i></button>` : ''}
            </div>
          </div>
        `).join('');
      }
    }
    loadAppointments();

    async function updateStatus(id, status) {
      await SUPABASE.from('hospital_opd_appointments').update({ status }).eq('id', id);
      loadAppointments();
    }

    // Modal
    function openModal() {
      document.getElementById('apptModal').classList.add('open');
      document.getElementById('newApptDate').value = document.getElementById('apptDate').value;
    }
    function closeModal() { document.getElementById('apptModal').classList.remove('open'); }

    async function saveAppointment() {
      const name = document.getElementById('newApptName').value.trim();
      if (!name) { alert('Patient name is required.'); return; }
      const dt = document.getElementById('newApptDate').value + 'T' + (document.getElementById('newApptTime').value || '09:00');

      // Upsert patient
      let patientId;
      const { data: existing } = await SUPABASE.from('hospital_patients').select('id').eq('full_name', name).maybeSingle();
      if (existing) {
        patientId = existing.id;
      } else {
        const { data: np } = await SUPABASE.from('hospital_patients').insert({
          uhid: 'APPT-' + Date.now(),
          full_name: name,
          mobile: document.getElementById('newApptMobile').value || null,
        }).select().single();
        patientId = np.id;
      }

      const doctorId = document.getElementById('newApptDoctor').value;
      const deptId = document.getElementById('newApptDept').value;

      await SUPABASE.from('hospital_opd_appointments').insert({
        patient_id: patientId,
        doctor_id: doctorId || null,
        department_id: deptId || null,
        appointment_date: dt,
        status: 'scheduled',
        notes: document.getElementById('newApptNotes').value,
      });

      closeModal();
      loadAppointments();
    }
  </script>
</body>
</html>
